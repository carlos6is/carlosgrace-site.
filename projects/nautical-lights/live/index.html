<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nautical Lights of Ireland</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
  :root { --sea: #090f1b; --ink: #ddd8ca; --line: #2a3348; }
  html, body { margin: 0; height: 100%; background: var(--sea); color: var(--ink);
               font-family: Spectral, Georgia, "Times New Roman", serif; }
  body { display: grid; place-items: center; overflow: hidden; }
  canvas { display: block; max-width: 100vw; max-height: 100vh; }
  #tip { position: fixed; pointer-events: none; display: none; white-space: nowrap;
         padding: 4px 9px; font-size: 15px; background: rgba(9,15,27,.88); border: 1px solid var(--line); }
  #ui { position: fixed; right: 14px; bottom: 14px; display: flex; gap: 8px; }
  button { font: inherit; font-size: 15px; color: var(--ink); background: rgba(9,15,27,.85);
           border: 1px solid var(--line); padding: 6px 14px; cursor: pointer; }
  button:hover { border-color: var(--ink); }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  button:disabled { opacity: .6; cursor: default; }
  #err { max-width: 34em; padding: 2em; line-height: 1.5; }
</style>
</head>
<body>
<canvas id="c" aria-label="Animated map of Irish nautical lights"></canvas>
<div id="tip" role="status"></div>
<div id="ui"><button id="rec" type="button">Record video</button></div>

<script src="data.js"></script>
<script>
// ---------- settings (URL params: ?scale=0.52&secs=30&speed=1) ----------
const Q = new URLSearchParams(location.search);
let SCALE = +Q.get('scale') || 0;         // 0.52 -> ~1080x1340, Instagram 4:5; default = screen-sharp
const REC_SECS = +Q.get('secs') || 20;
const SPEED = +Q.get('speed') || 1;        // keep 1 for real cycles
const MULTI_BEAM = Q.has('multibeam');     // ?multibeam = one beam per flash (old look)
const GLOW = +Q.get('glow') || 1.2;        // glow size multiplier
const EMBER = Q.has('noember') ? 0 : 0.18; // faint always-on glow so the coast stays traced
const TITLE = ['Nautical lights of', 'Ireland'];
const SUBTITLE = 'Every coastal light, on its real cycle.';
const CREDITS = [
  'Overlapping harbour lights consolidated',
  'Light data: OpenSeaMap / OpenStreetMap contributors (ODbL)',
  'Terrain: Terrarium DEM, AWS Terrain Tiles. Beams ray-cast against terrain',
  '© 2026 Carlos Grace',
];

const COL = { w:'255,232,190', y:'255,214,120', r:'255,70,56', g:'70,255,140', b:'120,160,255', o:'255,160,60' };

// ---------- setup ----------
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const tip = document.getElementById('tip'), recBtn = document.getElementById('rec');
if (Q.has('embed')) document.getElementById('ui').style.display = 'none'; // hide recorder when embedded in the portfolio

if (!window.MAP || !window.LIGHTS) {
  document.body.innerHTML = '<p id="err">data.js is missing. Run <code>python build.py</code> in this folder, then reload this page.</p>';
  throw new Error('no data');
}
// Render at the screen's real pixel density (Retina = 2x) so nothing is upscaled and blurred.
if (!SCALE) SCALE = Math.min(1, innerHeight * devicePixelRatio / MAP.h, innerWidth * devicePixelRatio / MAP.w);
cv.width = Math.round(MAP.w * SCALE);
cv.height = Math.round(MAP.h * SCALE);

const base = new Image();
base.src = MAP.basemap;

// Pre-rendered glow sprite per colour: white-hot core fading into the light colour.
const SPRITE = {};
for (const [k, rgb] of Object.entries(COL)) {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'), gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, 'rgba(255,255,255,1)');
  gr.addColorStop(0.05, 'rgba(255,255,255,0.95)');
  gr.addColorStop(0.1, `rgba(${rgb},0.85)`);
  gr.addColorStop(0.22, `rgba(${rgb},0.35)`);
  gr.addColorStop(0.45, `rgba(${rgb},0.08)`);
  gr.addColorStop(1, `rgba(${rgb},0)`);
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  SPRITE[k] = c;
}
for (const L of LIGHTS) {
  L.size = (5 + Math.sqrt(L.r) * 6) * GLOW;            // glow radius, map px
  L.gain = 0.55 + 0.45 * Math.min(1, L.r / 18);
  if (L.reach) {
    L.rmax = Math.max(...L.reach);
    // One beam per flash GROUP: flashes less than 2.5 s apart share a beam,
    // so Fl(4) gives one sweeping beam, not a fan of four.
    const groups = [];
    for (const [a, b] of L.on) {
      const g = groups[groups.length - 1];
      if (g && a - g[1] < 2.5 && !MULTI_BEAM) g[1] = b; else groups.push([a, b]);
    }
    L.beams = groups.map(([a, b]) => (a + b) / 2);
    // Quick-flashing marks (Q, VQ, UQ) are not rotating optics: no beam.
    if (/(^|[^L])(Q|VQ|UQ|IQ)/.test(L.ch)) L.reach = null;
  }
}

// ---------- light state ----------
const phase = (L, t) => (((t + L.ph) % L.p) + L.p) % L.p;

function level(L, t) {
  if (L.k === 'fixed') return 1;
  const u = phase(L, t), fade = 0.15;
  let v = 0;
  for (const [a, b] of L.on) {
    const inside = Math.min(u - a, b - u);
    v = Math.max(v, Math.min(1, Math.max(0, inside / fade + 0.5)));
  }
  return v;
}

// A rotating optic: one beam per flash, aimed toward the viewer (south) at the flash moment.
function wedge(L, deg, half) {
  ctx.beginPath();
  ctx.moveTo(L.x, L.y);
  for (let d = deg - half; d <= deg + half + 1e-6; d += 0.5) {
    const r = L.reach[((Math.round(d) % 360) + 360) % 360];
    const a = d * Math.PI / 180;
    ctx.lineTo(L.x + Math.sin(a) * r, L.y - Math.cos(a) * r);
  }
  ctx.closePath();
}

function drawBeams(L, t) {
  const u = phase(L, t), rgb = COL[L.c];
  for (const mid of L.beams) {
    const deg = 180 + 360 * (u - mid) / L.p;
    for (const [half, alpha] of [[7, 0.10], [2.5, 0.42]]) {
      const gr = ctx.createRadialGradient(L.x, L.y, 0, L.x, L.y, L.rmax);
      gr.addColorStop(0, `rgba(${rgb},${alpha})`);
      gr.addColorStop(0.2, `rgba(${rgb},${alpha * 0.45})`);
      gr.addColorStop(1, `rgba(${rgb},0)`);
      ctx.fillStyle = gr;
      wedge(L, deg, half);
      ctx.fill();
    }
  }
}

function drawText() {
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#ddd8ca';
  ctx.textBaseline = 'alphabetic';
  ctx.font = '300 44px Spectral, Georgia, serif';
  ctx.fillText(TITLE[0], 80, 130);
  ctx.font = '300 110px Spectral, Georgia, serif';
  ctx.fillText(TITLE[1], 74, 235);
  ctx.font = 'italic 300 34px Spectral, Georgia, serif';
  ctx.globalAlpha = 0.8;
  ctx.fillText(SUBTITLE, 80, 290);
  ctx.font = '300 21px Spectral, Georgia, serif';
  ctx.globalAlpha = 0.55;
  CREDITS.forEach((line, i) => ctx.fillText(line, 80, MAP.h - 70 - (CREDITS.length - 1 - i) * 30));
  ctx.globalAlpha = 1;
}

// ---------- render loop ----------
const t0 = performance.now();
function frame(now) {
  const t = (now - t0) / 1000 * SPEED;
  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(base, 0, 0);

  ctx.globalCompositeOperation = 'lighter';
  for (const L of LIGHTS) if (L.reach) drawBeams(L, t);
  for (const L of LIGHTS) {
    const on = level(L, t);
    const v = Math.max(EMBER, on) * L.gain;
    // wide soft halo: overlapping halos merge into a continuous coastline glow
    const H = L.size * 1.7;
    ctx.globalAlpha = v * 0.12;
    ctx.drawImage(SPRITE[L.c], L.x - H, L.y - H, H * 2, H * 2);
    // bright core
    const s = L.size * (0.8 + 0.2 * on);
    ctx.globalAlpha = v;
    ctx.drawImage(SPRITE[L.c], L.x - s, L.y - s, s * 2, s * 2);
  }
  ctx.globalAlpha = 1;
  drawText();
  requestAnimationFrame(frame);
}

Promise.all([
  base.decode(),
  document.fonts ? document.fonts.load('300 40px Spectral').catch(() => {}) : null,
]).then(() => requestAnimationFrame(frame));

// ---------- hover names ----------
cv.addEventListener('mousemove', e => {
  const r = cv.getBoundingClientRect();
  const mx = (e.clientX - r.left) / r.width * MAP.w, my = (e.clientY - r.top) / r.height * MAP.h;
  const reach = 12 * MAP.w / r.width;
  let best = null, bd = reach;
  for (const L of LIGHTS) {
    const d = Math.hypot(L.x - mx, L.y - my);
    if (d < bd) { bd = d; best = L; }
  }
  if (!best) { tip.style.display = 'none'; return; }
  tip.textContent = `${best.n || 'Unnamed light'}, ${best.ch} ${best.p}s${best.r ? `, ${best.r} NM` : ''}`;
  tip.style.left = e.clientX + 14 + 'px';
  tip.style.top = e.clientY + 14 + 'px';
  tip.style.display = 'block';
});
cv.addEventListener('mouseleave', () => tip.style.display = 'none');

// ---------- recording ----------
recBtn.addEventListener('click', () => {
  const mime = ['video/mp4;codecs=avc1', 'video/webm;codecs=vp9', 'video/webm']
    .find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m));
  if (!mime) { recBtn.textContent = 'Recording not supported in this browser'; return; }
  const mr = new MediaRecorder(cv.captureStream(30), { mimeType: mime, videoBitsPerSecond: 20e6 });
  const chunks = [];
  mr.ondataavailable = e => e.data.size && chunks.push(e.data);
  mr.onstop = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(chunks, { type: mime }));
    a.download = 'lighthouses-ireland.' + (mime.startsWith('video/mp4') ? 'mp4' : 'webm');
    a.click();
    recBtn.disabled = false; recBtn.textContent = 'Record video';
  };
  mr.start();
  recBtn.disabled = true;
  let left = REC_SECS;
  recBtn.textContent = `Recording, ${left} s left`;
  const iv = setInterval(() => {
    left--;
    if (left <= 0) { clearInterval(iv); mr.stop(); recBtn.textContent = 'Saving'; }
    else recBtn.textContent = `Recording, ${left} s left`;
  }, 1000);
});
</script>
</body>
</html>
